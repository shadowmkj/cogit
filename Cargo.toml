[package]
name = "cogit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast, AI-powered conventional commit assistant for Git with interactive CLI and TUI modes"
repository = "https://github.com/shadowmkj/cogit"
homepage = "https://github.com/shadowmkj/cogit"
readme = "README.md"
keywords = ["git", "conventional-commits", "cli", "tui", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
inquire = "0.9.4"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
